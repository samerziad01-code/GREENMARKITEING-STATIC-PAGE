<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Green Marketing Agency</title>
<link rel="icon" type="image/png" href="/assets/logo-mark.png">
<script>
// Old addresses: /ar (Arabic) and /en (English) now live at /?lang=ar and /
(function () {
  var p = location.pathname.replace(/\/+$/, '').toLowerCase();
  if (p === '/ar') location.replace('/?lang=ar' + location.hash);
  else if (p === '/en' || p === '/index' || p === '/home') location.replace('/' + location.hash);
})();
</script>
<style>
  :root { --bg: #EBE1D2; --ink: #1d2b1a; --accent: #41A223; --deep: #386338; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1710; --ink: #EBE1D2; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif; text-align: center; }
  img { width: 72px; height: auto; margin-bottom: 18px; }
  h1 { font-size: clamp(30px, 6vw, 48px); margin: 0 0 8px; }
  p { margin: 0 0 26px; opacity: .8; font-size: 17px; line-height: 1.6; }
  .ar { font-family: "Readex Pro", Tahoma, sans-serif; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; background: var(--deep); color: #fff; text-decoration: none; font-weight: 600; }
  a.btn--alt { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--accent); }
</style>
</head>
<body>
  <main>
    <img src="/assets/logo-mark.png" alt="Green Marketing">
    <h1>Page not found</h1>
    <p>This page doesn't exist anymore.<br><span class="ar" dir="rtl">الصفحة غير موجودة.</span></p>
    <div class="btns">
      <a class="btn" href="/">Go to the homepage</a>
      <a class="btn btn--alt ar" href="/?lang=ar">الصفحة الرئيسية</a>
    </div>
  </main>
</body>
</html>
